name: RAG Docker CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  smoke-test:
    name: Smoke tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Compile RAG/API modules
        run: |
          python -m compileall app.py src/rag scripts

      - name: Run lightweight tests
        run: |
          pytest tests/test_rag_evaluation_report.py tests/test_rag_retrieval_policy.py tests/test_rag_db_seeder.py -q

      - name: Validate Docker Compose config
        run: |
          cp .env.example .env
          docker compose config

  docker-build-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: smoke-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tmf-classifier:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tmf-classifier:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
